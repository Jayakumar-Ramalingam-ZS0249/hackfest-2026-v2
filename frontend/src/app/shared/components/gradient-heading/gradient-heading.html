@switch (level()) {
  @case (1) {
    <h1 class="gradient-heading gradient-heading--1"><ng-content /></h1>
  }
  @case (2) {
    <h2 class="gradient-heading gradient-heading--2"><ng-content /></h2>
  }
  @default {
    <h3 class="gradient-heading gradient-heading--3"><ng-content /></h3>
  }
}
@if (subtitle()) {
  <p class="gradient-heading__subtitle">{{ subtitle() }}</p>
}
