<span
  class="verification-badge"
  [class.verification-badge--ok]="verified()"
  [class.verification-badge--fail]="!verified()"
>
  <span class="verification-badge__icon" aria-hidden="true">
    @if (verified()) {
      <svg viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="10" fill="currentColor" opacity="0.14" />
        <path d="M5.5 10.3l2.8 2.8L14.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    } @else {
      <svg viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="10" fill="currentColor" opacity="0.14" />
        <path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    }
  </span>
  <span class="verification-badge__text">
    <span class="verification-badge__label">{{ label() }}</span>
    <span class="verification-badge__state">{{ verified() ? 'Verified' : 'Not verified' }}</span>
  </span>
</span>
