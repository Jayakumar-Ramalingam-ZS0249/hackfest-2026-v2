<header class="top-nav">
  <div class="top-nav__inner">
    <a routerLink="/dashboard" class="top-nav__brand">
      <span class="top-nav__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="brandMarkGradient" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0" stop-color="#3e5fff" />
              <stop offset="1" stop-color="#8a4fff" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brandMarkGradient)" />
          <path d="M10 17l4 4 8-9" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="top-nav__wordmark">Claims Copilot</span>
    </a>

    <nav class="top-nav__links" aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="top-nav__link--active" class="top-nav__link">Dashboard</a>
      <a routerLink="/applications" routerLinkActive="top-nav__link--active" class="top-nav__link">Applications</a>
      <a routerLink="/audit-log" routerLinkActive="top-nav__link--active" class="top-nav__link">Audit Log</a>
    </nav>

    <div class="top-nav__status">
      @if (health(); as h) {
        <span class="engine-pill" [class.engine-pill--live]="h.claude_configured">
          <span class="engine-pill__dot" aria-hidden="true"></span>
          {{ h.claude_configured ? 'Claude ' + h.model + ' connected' : 'Rule-based fallback mode' }}
        </span>
      } @else {
        <span class="engine-pill">
          <span class="engine-pill__dot" aria-hidden="true"></span>
          Connecting…
        </span>
      }
    </div>
  </div>
</header>
